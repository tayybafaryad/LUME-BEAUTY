
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — LUMÉ</title>
<link rel="icon" type="image/png" href="image.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="shop">

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="breadcrumb"><a href="index.html">Home</a> / <a href="cart.html">Bag</a> / Checkout</p>
      <span class="eyebrow" style="justify-content:center;">Last Step</span>
      <h1>Checkout</h1>
    </div>
  </section>

  <section class="section-tight">
    <div class="container checkout-layout">
      <form id="checkoutForm">
        <div class="checkout-section">
          <h3><span class="step-num">1</span> Customer Information</h3>
          <div class="form-grid">
            <div class="form-field"><label>Full Name</label><input id="ckName" name="ckName" type="text" required /></div>
            <div class="form-field"><label>Email Address</label><input id="ckEmail" name="ckEmail" type="email" required /></div>
            <div class="form-field full"><label>Phone Number</label><input id="ckPhone" name="ckPhone" type="tel" required /></div>
          </div>
        </div>

        <div class="checkout-section">
          <h3><span class="step-num">2</span> Shipping Address</h3>
          <div class="form-grid">
            <div class="form-field full"><label>Street Address</label><input id="ckAddress" name="ckAddress" type="text" required /></div>
            <div class="form-field"><label>City</label><input id="ckCity" name="ckCity" type="text" required /></div>
            <div class="form-field"><label>ZIP / Postal Code</label><input id="ckZip" name="ckZip" type="text" required /></div>
            <div class="form-field full">
              <label>Country</label>
              <select id="ckCountry" name="ckCountry" required>
                <option>Pakistan</option><option>United States</option><option>United Kingdom</option>
                <option>United Arab Emirates</option><option>Canada</option><option>Australia</option>
              </select>
            </div>
          </div>
        </div>

        <div class="checkout-section">
          <h3><span class="step-num">3</span> Payment Method</h3>
          <div class="pay-options">
            <label class="pay-option"><input type="radio" name="payMethod" value="Card" checked /> Credit / Debit Card</label>
            <label class="pay-option"><input type="radio" name="payMethod" value="Cash on Delivery" /> Cash on Delivery</label>
            <label class="pay-option"><input type="radio" name="payMethod" value="Digital Wallet" /> Digital Wallet</label>
          </div>
          <div class="form-grid" style="margin-top:18px;">
            <div class="form-field full"><label>Card Number</label><input type="text" placeholder="•••• •••• •••• ••••" /></div>
            <div class="form-field"><label>Expiry</label><input type="text" placeholder="MM / YY" /></div>
            <div class="form-field"><label>CVC</label><input type="text" placeholder="•••" /></div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Place Order</button>
      </form>

      <aside class="summary-card">
        <h3>Order Summary</h3>
        <div id="checkoutItems" style="max-height:280px; overflow:auto;"></div>
        <div class="mini-line"><span>Subtotal</span><span id="coSubtotal">$0.00</span></div>
        <div class="mini-line"><span>Shipping</span><span id="coShipping">Free</span></div>
        <div class="mini-line"><span>Tax</span><span id="coTax">$0.00</span></div>
        <div class="summary-row total"><span>Total</span><span id="coTotal">$0.00</span></div>
      </aside>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="data.js"></script>
<script src="storage.js"></script>
<script src="shared.js"></script>
<script src="layout.js"></script>
<script src="checkout.js"></script>
</body>
</html>
