
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Bag — LUMÉ</title>
<link rel="icon" type="image/png" href="image.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="shop">

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="breadcrumb"><a href="index.html">Home</a> / Shopping Bag</p>
      <span class="eyebrow" style="justify-content:center;">Almost There</span>
      <h1>Your Bag</h1>
    </div>
  </section>

  <section class="section-tight">
    <div class="container cart-layout">
      <div>
        <div id="cartLines"></div>
        <div class="empty-state" id="cartEmpty" style="display:none;">
          <div class="ic" id="cartEmptyIc"></div>
          <h3>Your bag is feeling light</h3>
          <p>Add a few favorites and they'll show up here.</p>
          <a href="shop.html" class="btn btn-primary" style="margin-top:16px;">Continue Shopping</a>
        </div>
      </div>

      <aside class="summary-card" id="cartSummaryWrap">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">$0.00</span></div>
        <div class="summary-row" id="sumDiscountRow" style="display:none;"><span>Promo discount</span><span id="sumDiscount">$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span id="sumShipping">Free</span></div>
        <div class="summary-row total"><span>Total</span><span id="sumTotal">$0.00</span></div>

        <form class="promo-row" id="promoForm">
          <input type="text" id="promoInput" placeholder="Promo code (try GLOW20)" />
          <button class="btn btn-outline btn-sm" type="submit">Apply</button>
        </form>

        <a href="checkout.html" class="btn btn-primary btn-block">Proceed to Checkout</a>
        <a href="shop.html" class="btn btn-outline btn-block" style="margin-top:10px;">Continue Shopping</a>
      </aside>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="data.js"></script>
<script src="storage.js"></script>
<script src="shared.js"></script>
<script src="layout.js"></script>
<script src="cart.js"></script>
<script>
  document.getElementById("cartEmptyIc").innerHTML = Icons.bag;
</script>
</body>
</html>
