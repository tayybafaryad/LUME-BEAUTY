
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login / Register — LUMÉ</title>
<link rel="icon" type="image/png" href="image.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="shop">
<div id="site-header"></div>

<main>
  <section class="section-tight">
    <div class="container">

      <div class="auth-wrap" id="authGate">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="loginPanel">Login</button>
          <button class="auth-tab" data-tab="registerPanel">Register</button>
        </div>

        <div class="auth-panel active" id="loginPanel">
          <h2 style="text-align:center; margin-bottom:6px;">Welcome back</h2>
          <p style="text-align:center; margin-bottom:24px;">Login to view your orders and wishlist.</p>
          <div class="form-error" id="loginError"></div>
          <form id="loginForm">
            <div class="form-field"><label>Email Address</label><input id="loginEmail" type="email" required /></div>
            <div class="form-field"><label>Password</label><input id="loginPassword" type="password" required minlength="6" /></div>
            <button class="btn btn-primary btn-block" type="submit">Login</button>
          </form>
          <p class="auth-foot">New to LUMÉ? <a href="#" onclick="switchAuthTab('registerPanel'); return false;" style="color:var(--rose-dark); font-weight:700;">Create an account</a></p>
        </div>

        <div class="auth-panel" id="registerPanel">
          <h2 style="text-align:center; margin-bottom:6px;">Join LUMÉ</h2>
          <p style="text-align:center; margin-bottom:24px;">Create an account for faster checkout & order tracking.</p>
          <div class="form-error" id="registerError"></div>
          <form id="registerForm">
            <div class="form-field"><label>Full Name</label><input id="regName" type="text" required /></div>
            <div class="form-field"><label>Email Address</label><input id="regEmail" type="email" required /></div>
            <div class="form-field"><label>Password</label><input id="regPassword" type="password" required minlength="6" /></div>
            <div class="form-field"><label>Confirm Password</label><input id="regConfirm" type="password" required minlength="6" /></div>
            <button class="btn btn-primary btn-block" type="submit">Create Account</button>
          </form>
          <p class="auth-foot">Already have an account? <a href="#" onclick="switchAuthTab('loginPanel'); return false;" style="color:var(--rose-dark); font-weight:700;">Login</a></p>
        </div>
      </div>

      <div class="auth-wrap" id="accountPanel" style="display:none; text-align:center;">
        <span class="cat-ic" style="margin:0 auto 16px; width:56px; height:56px;" id="accIcon"></span>
        <h2 id="accName" style="margin-bottom:4px;"></h2>
        <p id="accEmail" style="margin-bottom:24px;"></p>
        <a href="orders.html" class="btn btn-primary btn-block" style="margin-bottom:10px;">View My Orders</a>
        <a href="wishlist.html" class="btn btn-outline btn-block" style="margin-bottom:10px;">View Wishlist</a>
        <button class="btn btn-outline btn-block" id="logoutBtn">Log Out</button>
      </div>

    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="data.js"></script>
<script src="storage.js"></script>
<script src="shared.js"></script>
<script src="layout.js"></script>
<script src="auth.js"></script>
<script>
  const accIc = document.getElementById("accIcon");
  if (accIc) accIc.innerHTML = Icons.user;
</script>
</body>
</html>
