
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop All Skincare — LUMÉ</title>
<meta name="description" content="Browse LUMÉ's full skincare collection: cleansers, serums, moisturizers, masks, sun care and gift sets." />
<link rel="icon" type="image/png" href="image.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="shop">

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="breadcrumb"><a href="index.html">Home</a> / Shop</p>
      <span class="eyebrow" style="justify-content:center;">Full Collection</span>
      <h1>Shop the Ritual</h1>
      <p style="max-width:520px; margin:0 auto;">Filter by category, skin type or price to find the formula your skin's been asking for.</p>
    </div>
  </section>

  <section class="section-tight">
    <div class="container shop-layout">
      <aside class="filters">
        <h3>Filters</h3>

        <div class="filter-group">
          <input class="filter-search-input" id="shopSearchInput" type="search" placeholder="Search products…"
            style="width:100%; padding:10px 14px; border-radius:100px; border:1px solid var(--line); font-size:.85rem; margin-bottom:4px;" />
        </div>

        <div class="filter-group">
          <h4>Category</h4>
          <div id="catFilterGroup"></div>
        </div>

        <div class="filter-group">
          <h4>Skin Type</h4>
          <div id="skinFilterGroup"></div>
        </div>

        <div class="filter-group">
          <h4>Price</h4>
          <input type="range" id="priceRange" min="8" max="130" value="130" step="2" />
          <div class="range-row"><span id="priceRangeLabel">$0 – $130</span></div>
        </div>

        <button class="clear-filters" id="clearFiltersBtn">Clear all filters</button>
      </aside>

      <div>
        <div class="chips-row" id="chipsRow"></div>
        <div class="shop-toolbar">
          <span class="result-count" id="resultCount"></span>
          <select class="sort-select" id="sortSelect">
            <option value="featured">Sort: Featured</option>
            <option value="newest">Newest</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Highest Rated</option>
          </select>
        </div>
        <div class="product-grid" id="shopGrid"></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="data.js"></script>
<script src="storage.js"></script>
<script src="shared.js"></script>
<script src="layout.js"></script>
<script src="shop.js"></script>
</body>
</html>
